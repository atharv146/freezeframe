[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "freezeframe"
version = "0.1.0"
description = "A flight recorder for your computer: it keeps the last few days of what every app was doing, notices freezes on its own, and explains them in plain English."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "atharv146" }]
keywords = ["performance", "freeze", "hang", "crash", "diagnostics", "monitoring", "macos", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/atharv146/freezeframe"

[project.scripts]
freezeframe = "freezeframe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freezeframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
